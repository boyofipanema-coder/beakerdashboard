<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAKER Caption Studio — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f5f0; --surface:#fff; --surface2:#f0ede8;
  --border:#e5e1d8; --border-hover:#ccc8be;
  --ink:#1a1915; --ink2:#6b6760; --ink3:#a09c95;
  --accent:#d97706; --accent-dim:rgba(217,119,6,.08);
  --purple:#7c3aed; --purple-dim:rgba(124,58,237,.08);
  --green:#15803d; --green-dim:rgba(21,128,61,.08);
  --mono:'DM Mono',monospace;
  --sans:'DM Sans','Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;font-size:14px}
.hd{position:sticky;top:0;z-index:100;background:rgba(247,245,240,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;height:52px}
.hd-logo{font-weight:700;font-size:15px;letter-spacing:2.5px}
.hd-sep{margin:0 10px;color:var(--ink3);font-weight:300}
.hd-title{font-family:var(--mono);font-size:11px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.hd-spacer{flex:1}
.hd-stat{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:16px}
.hd-stat b{color:var(--accent);font-weight:500}

.wrap{max-width:1100px;margin:0 auto;padding:20px 24px}

.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;flex:1;min-width:140px}
.stat-label{font-size:11px;color:var(--ink3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:600;color:var(--ink)}
.stat-sub{font-size:11px;color:var(--ink3);margin-top:2px}

.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--ink2);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .15s}
.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.filter-btn:hover{border-color:var(--border-hover)}

.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s}
.row:hover{border-color:var(--border-hover)}
.row-main{display:grid;grid-template-columns:90px 80px 1fr 1fr 60px;align-items:center;padding:14px 18px;cursor:pointer;gap:12px}
.row-main.ed{grid-template-columns:90px 80px 1fr 1fr 60px}

.cell-date{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.cell-date-sub{font-size:10px;color:var(--ink3)}
.mode-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em}
.mode-caption{background:var(--accent-dim);color:var(--accent)}
.mode-editorial{background:var(--purple-dim);color:var(--purple)}
.cell-brand{font-weight:600;font-size:13px}
.cell-settings{font-size:11px;color:var(--ink2);line-height:1.6}
.cell-settings .tag{display:inline-block;background:var(--surface2);padding:2px 7px;border-radius:3px;margin:1px 2px;font-size:10px;color:var(--ink2)}
.cell-ver{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:center}

.row-detail{display:none;padding:0 18px 18px;border-top:1px solid var(--border)}
.row-detail.open{display:block}
.detail-label{font-size:10px;font-weight:600;color:var(--ink3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.detail-text{font-size:13px;line-height:1.9;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;padding:12px;background:var(--surface2);border-radius:8px}
.detail-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
.meta-item{font-size:11px}
.meta-key{color:var(--ink3);font-family:var(--mono);font-size:10px;text-transform:uppercase}
.meta-val{color:var(--ink);font-weight:500;margin-top:2px}
.copy-btn{background:var(--surface2);border:1px solid var(--border);color:var(--ink2);padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:var(--sans);margin-top:10px}
.copy-btn:hover{background:var(--border)}

.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-icon{font-size:32px;opacity:.3;margin-bottom:8px}

@media(max-width:768px){
  .row-main{grid-template-columns:70px 60px 1fr 50px;font-size:12px}
  .cell-settings{display:none}
  .stats{flex-direction:column}
  .wrap{padding:12px}
}
</style>
</head>
<body>
<div class="hd">
  <span class="hd-logo">BEAKER</span>
  <span class="hd-sep">/</span>
  <span class="hd-title">Dashboard</span>
  <span class="hd-spacer"></span>
  <span class="hd-stat" id="hdCount"></span>
</div>

<div class="wrap">
  <div class="stats" id="statsArea"></div>
  <div class="filters" id="filterArea"></div>
  <div class="list" id="listArea"></div>
</div>

<script>
var W='https://beaker-caption-log.boyofipanema.workers.dev';
var logs=[], filter='all';

function init(){
  // 통계
  fetch(W+'/stats').then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById('statsArea');
    el.innerHTML=
      '<div class="stat-card"><div class="stat-label">Total</div><div class="stat-val">'+(d.totalConfirms+(d.totalEditorials||0))+'</div><div class="stat-sub">캡션 '+d.totalConfirms+' · 에디토리얼 '+(d.totalEditorials||0)+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">수정 비율</div><div class="stat-val">'+(d.directVsRevised?Math.round(d.directVsRevised.revised/(d.directVsRevised.direct+d.directVsRevised.revised||1)*100):0)+'%</div><div class="stat-sub">바로 컨펌 '+((d.directVsRevised||{}).direct||0)+' · 수정 후 '+((d.directVsRevised||{}).revised||0)+'</div></div>'
      +'<div class="stat-card"><div class="stat-label">브랜드</div><div class="stat-val">'+Object.keys(d.brandCount||{}).length+'</div><div class="stat-sub">'+Object.entries(d.brandCount||{}).sort(function(a,b){return b[1]-a[1];}).slice(0,3).map(function(e){return e[0]+' '+e[1];}).join(' · ')+'</div></div>';
    document.getElementById('hdCount').innerHTML='<b>'+(d.totalConfirms+(d.totalEditorials||0))+'</b> confirms';
  }).catch(function(){});

  // 통합 로그
  fetch(W+'/logs-all?limit=200').then(function(r){return r.json();}).then(function(d){
    logs=d.logs||[];
    renderFilters();
    renderList();
  }).catch(function(e){
    document.getElementById('listArea').innerHTML='<div class="empty"><div class="empty-icon">⚠</div>데이터를 불러올 수 없습니다.<br><span style="font-size:11px">'+e.message+'</span></div>';
  });
}

function renderFilters(){
  var modes={all:0,caption:0,editorial:0};
  logs.forEach(function(l){modes[l.mode||'caption']++;modes.all++;});
  var html=['all','caption','editorial'].map(function(m){
    var label=m==='all'?'전체 ('+modes.all+')':m==='caption'?'캡션 ('+modes.caption+')':'에디토리얼 ('+modes.editorial+')';
    return '<button class="filter-btn'+(filter===m?' active':'')+'" onclick="setFilter(\''+m+'\')">'+label+'</button>';
  }).join('');
  document.getElementById('filterArea').innerHTML=html;
}

function setFilter(m){filter=m;renderFilters();renderList();}

function renderList(){
  var filtered=logs.filter(function(l){
    if(filter==='all') return true;
    return (l.mode||'caption')===filter;
  });
  if(!filtered.length){
    document.getElementById('listArea').innerHTML='<div class="empty"><div class="empty-icon">📋</div>아직 컨펌된 기록이 없습니다.</div>';
    return;
  }
  document.getElementById('listArea').innerHTML=filtered.map(function(l){return rowHTML(l);}).join('');
}

function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function rowHTML(l){
  var dt=new Date(l.timestamp);
  var ds=dt.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'});
  var ts=dt.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  var mode=l.mode||'caption';
  var isEd=mode==='editorial';

  // 설정 태그 생성
  var tags=[];
  if(!isEd){
    if(l.target) tags.push(l.target);
    if(l.attributes&&l.attributes.length) tags=tags.concat(l.attributes.slice(0,2));
    if(l.editorial!=null&&l.emotional!=null) tags.push('ed'+l.editorial+'/em'+l.emotional);
    if(l.tone!=null) tags.push('톤'+l.tone);
  } else {
    if(l.type) tags.push(l.type);
    if(l.tone) tags.push(l.tone);
    if(l.length) tags.push(l.length);
  }
  var tagsHTML=tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');

  var modeClass=isEd?'mode-editorial':'mode-caption';
  var modeLabel=isEd?'Editorial':'Caption';

  return '<div class="row" id="R_'+l.id+'">'
    +'<div class="row-main" onclick="toggleDetail(\''+l.id+'\')">'
    +'<div><span class="cell-date">'+ds+'</span><br><span class="cell-date-sub">'+ts+'</span></div>'
    +'<div><span class="mode-badge '+modeClass+'">'+modeLabel+'</span></div>'
    +'<div><span class="cell-brand">'+esc(l.brand||'-')+'</span></div>'
    +'<div class="cell-settings">'+tagsHTML+'</div>'
    +'<div class="cell-ver">'+esc(l.confirmedVer||'-')+'</div>'
    +'</div>'
    +'<div class="row-detail" id="D_'+l.id+'"></div>'
    +'</div>';
}

function toggleDetail(id){
  var el=document.getElementById('D_'+id);
  if(el.classList.contains('open')){
    el.classList.remove('open');
    el.innerHTML='';
    return;
  }
  // 다른 열린 디테일 닫기
  document.querySelectorAll('.row-detail.open').forEach(function(e){e.classList.remove('open');e.innerHTML='';});
  el.innerHTML='<div style="padding:14px 0;color:var(--ink3);font-size:12px">로딩 중...</div>';
  el.classList.add('open');

  fetch(W+'/log/'+id).then(function(r){
    if(!r.ok) throw new Error(''+r.status);
    return r.json();
  }).then(function(l){
    el.innerHTML=detailHTML(l);
  }).catch(function(e){
    el.innerHTML='<div style="padding:14px 0;color:var(--ink3);font-size:12px">상세 정보를 불러올 수 없습니다. ('+e.message+')</div>';
  });
}

function detailHTML(l){
  var p=l.params||{};
  var isEd=(l.mode==='editorial');
  var html='';

  // 컨펌 텍스트
  html+='<div class="detail-label">컨펌 텍스트</div>';
  html+='<div class="detail-text">'+esc(l.confirmedText||'')+'</div>';
  html+='<button class="copy-btn" onclick="copyText(this,\''+l.id+'\')">복사</button>';

  // 에디토리얼: original vs confirmed
  if(isEd && l.originalText){
    var revCount=(l.revisions||[]).length;
    html+='<div class="detail-label">수정 이력</div>';
    html+='<div style="font-size:12px;color:var(--ink2);line-height:1.6">';
    html+='AI 최초 생성 → '+(revCount>0?revCount+'회 수정 → ':'')+'컨펌';
    html+='</div>';
  }

  // 썸네일 (에디토리얼)
  if(isEd && l.thumbnail){
    html+='<div class="detail-label">썸네일</div>';
    html+='<div style="font-size:12px;color:var(--ink);line-height:1.7;white-space:pre-wrap;padding:8px 12px;background:var(--surface2);border-radius:6px">'+esc(l.thumbnail)+'</div>';
  }

  // 파라미터 상세
  html+='<div class="detail-label">파라미터</div>';
  html+='<div class="detail-meta">';
  if(!isEd){
    html+=metaItem('브랜드',p.brand);
    html+=metaItem('타겟',p.target);
    html+=metaItem('어트리뷰션',(p.attributes||[]).join(', '));
    html+=metaItem('에디토리얼',p.editorial!=null?p.editorial+'%':'-');
    html+=metaItem('감성',p.emotional!=null?p.emotional+'%':'-');
    html+=metaItem('정보',p.info!=null?p.info+'%':'-');
    html+=metaItem('톤',p.tone);
    html+=metaItem('이모지',p.emoji);
    html+=metaItem('길이',p.length);
    html+=metaItem('훅 언어',p.hookLang);
    html+=metaItem('포맷',p.format);
    html+=metaItem('버전',l.confirmedVer);
    html+=metaItem('수정 깊이',l.revisionDepth);
  } else {
    html+=metaItem('브랜드',p.brand);
    html+=metaItem('유형',p.type);
    html+=metaItem('톤',p.tone);
    html+=metaItem('길이',p.length);
    html+=metaItem('초안 유무',p.hasDraft?'있음':'없음');
    html+=metaItem('수정 횟수',(l.revisions||[]).length);
  }
  html+='</div>';

  return html;
}

function metaItem(k,v){
  return '<div class="meta-item"><div class="meta-key">'+esc(k)+'</div><div class="meta-val">'+esc(v!=null?''+v:'-')+'</div></div>';
}

function copyText(btn,id){
  var log=logs.find(function(l){return l.id===id;});
  // 인덱스에는 confirmedText가 없으므로 detail에서 가져옴
  var el=document.getElementById('D_'+id);
  var textEl=el.querySelector('.detail-text');
  if(textEl){
    navigator.clipboard.writeText(textEl.textContent);
    btn.textContent='✓ 복사됨';
    setTimeout(function(){btn.textContent='복사';},1500);
  }
}

init();
</script>
</body>
</html>
